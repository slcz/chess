<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chess — FFI board</title>
<style>
  :root {
    --light: #f0d9b5; --dark: #b58863;
    --hl: rgba(255, 215, 0, .45);
    --sel: rgba(20, 85, 30, .35);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #262421; color: #e8e6e3; margin: 0; padding: 24px;
  }
  #app { display: flex; gap: 28px; align-items: flex-start; }

  /* ---- board ---- */
  #boardwrap { display: flex; gap: 4px; }
  #ranks, #files { display: flex; font-size: 11px; color: #9c9389; }
  #ranks { flex-direction: column; justify-content: space-around; text-align: right; width: 14px; }
  #files { justify-content: space-around; padding: 4px 0 0 0; }
  #files { width: 100%; }
  #boardcol { display: flex; flex-direction: column; }
  #board {
    display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px);
    border: 4px solid #4a4238; user-select: none; touch-action: manipulation;
  }
  .cell { position: relative; cursor: default; }
  .cell.light { background: var(--light); }
  .cell.dark  { background: var(--dark); }
  .cell .piece {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 44px; line-height: 60px; cursor: pointer;
  }
  .wp .piece { color: #fafafa; -webkit-text-stroke: 1.6px #3a3226; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .bp .piece { color: #1e1b17; text-shadow: 0 1px 1px rgba(255,255,255,.12); }
  .cell.hl   { box-shadow: inset 0 0 0 60px var(--hl); }
  .cell.sel  { box-shadow: inset 0 0 0 60px var(--sel); }
  .cell.check { box-shadow: inset 0 0 0 60px rgba(200, 30, 30, .55); }
  .cell .dot {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
    margin: -8px 0 0 -8px; border-radius: 50%; background: rgba(20, 85, 30, .5);
  }
  .cell .ring {
    position: absolute; inset: 4px; border: 4px solid rgba(20, 85, 30, .55); border-radius: 50%;
  }
  .cell.clickable .piece { cursor: pointer; }
  .cell.own { cursor: pointer; }

  /* ---- left column ---- */
  #status { margin-top: 10px; font-size: 15px; min-height: 22px; }
  #controls { margin-top: 8px; display: flex; gap: 6px; }
  button {
    background: #4a4238; color: #e8e6e3; border: 0; border-radius: 4px;
    padding: 6px 14px; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #5c534a; }
  button:disabled { opacity: .35; cursor: default; }

  /* ---- right column ---- */
  #panel { width: 300px; display: flex; flex-direction: column; gap: 14px; }
  #panel h1 { font-size: 17px; margin: 0; color: #c9b98a; }
  #setup { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  select, #setup button { background: #37332e; color: #e8e6e3; border: 1px solid #5c534a; border-radius: 4px; padding: 4px 6px; }
  #result { font-size: 14px; color: #f0d9b5; min-height: 18px; }
  #moves {
    margin: 0; padding: 6px 10px; background: #1e1c1a; border-radius: 6px;
    max-height: 420px; overflow-y: auto; font-size: 14px; line-height: 1.7;
    list-style: none;
  }
  #moves li { cursor: pointer; border-radius: 3px; padding: 0 4px; display: inline-block; }
  #moves li:hover { background: #37332e; }
  #moves li.cur { background: #6a54a0; }
  #moves .num { color: #9c9389; margin-right: 2px; }
  #fen { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #9c9389; word-break: break-all; }
  #err { color: #e07070; font-size: 13px; min-height: 16px; }

  /* promotion picker */
  #promo {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #37332e; border: 1px solid #5c534a; border-radius: 8px;
    padding: 14px; display: none; z-index: 10; text-align: center;
  }
  #promo button { font-size: 34px; padding: 4px 12px; margin: 0 4px; }
  .viewing #board { outline: 3px solid #6a54a0; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="boardcol">
      <div id="boardwrap">
        <div id="ranks"></div>
        <div id="board"></div>
      </div>
      <div id="files"></div>
    </div>
    <div id="status"></div>
    <div id="controls">
      <button id="bFirst" title="first (Home)">|&lt;</button>
      <button id="bPrev" title="previous (&larr;)">&lt;</button>
      <button id="bPlay" title="autoplay (space)">&#9654;</button>
      <button id="bNext" title="next (&rarr;)">&gt;</button>
      <button id="bLast" title="last (End)">|&gt;</button>
      <button id="bUndo" title="undo to your previous move">&#8630; undo</button>
    </div>
    <div id="err"></div>
  </div>
  <div id="panel">
    <h1>chess &mdash; FFI board</h1>
    <div id="setup">
      <label>W <select id="selW"></select></label>
      <label>B <select id="selB"></select></label>
      <button id="bNew">New game</button>
    </div>
    <div id="result"></div>
    <ol id="moves"></ol>
    <div id="fen"></div>
  </div>
</div>
<div id="promo"><div style="margin-bottom:8px">Promote to</div>
  <button data-p="q">&#9819;</button><button data-p="r">&#9820;</button>
  <button data-p="b">&#9821;</button><button data-p="n">&#9822;</button>
</div>

<script>
"use strict";
const GLYPH = { P: "\u265F", N: "\u265E", B: "\u265D", R: "\u265C", Q: "\u265B", K: "\u265A" };
const FILES = "abcdefgh";

let S = null;      // last server state
let view = 0;      // ply currently displayed (history index)
let sel = null;    // selected square name, e.g. "e2"
let playTimer = null;

const boardEl = document.getElementById("board");
const cells = [];

// Build the 64 cells once: display row 0 = rank 8 (white at the bottom).
for (let row = 0; row < 8; row++) {
  for (let col = 0; col < 8; col++) {
    const rank = 7 - row, file = col;
    const name = FILES[file] + (rank + 1);
    const d = document.createElement("div");
    d.className = "cell " + (((rank + file) % 2 === 0) ? "dark" : "light");
    d.dataset.sq = name;
    d.addEventListener("click", () => onCell(name));
    boardEl.appendChild(d);
    cells[name] = d;
  }
}
{
  const ranks = document.getElementById("ranks"), files = document.getElementById("files");
  for (let r = 8; r >= 1; r--) { const d = document.createElement("div"); d.textContent = r; ranks.appendChild(d); }
  for (const f of FILES) { const d = document.createElement("div"); d.textContent = f; files.appendChild(d); }
}

function live() { return S.history.length - 1; }
function termText() {
  if (S.termination === "PLAYING") return "";
  const w = { CHECKMATE: "checkmate", STALEMATE: "stalemate",
    INSUFFICIENT_MATERIAL: "insufficient material", FIFTY_MOVES: "50-move rule",
    SEVENTYFIVE_MOVES: "75-move rule", THREEFOLD_REPETITION: "threefold repetition",
    FIVEFOLD_REPETITION: "fivefold repetition" }[S.termination] || S.termination;
  if (S.winner === "w") return "1\u20130  white wins by " + w;
  if (S.winner === "b") return "0\u20131  black wins by " + w;
  return "\u00BD\u2013\u00BD  draw by " + w;
}
function sideName(c) { return c === "w" ? "White" : "Black"; }
function controller(side) { return side === "w" ? S.white : S.black; }

function render() {
  const browsing = view < live();
  document.body.classList.toggle("viewing", browsing);
  const st = S.history[view];
  const placement = st.fen.split(" ")[0];
  const targets = new Set(st.uci ? [st.uci.slice(0, 2), st.uci.slice(2, 4)] : []);

  for (const name in cells) {
    const d = cells[name];
    d.classList.remove("hl", "sel", "check", "wp", "bp");
    d.querySelectorAll(".dot,.ring").forEach(e => e.remove());
    let piece = d.querySelector(".piece"); if (piece) piece.remove();
  }
  let row = 0, file = 0;
  for (const ch of placement) {
    if (ch === "/") { row++; file = 0; continue; }
    if (ch >= "1" && ch <= "8") { file += +ch; continue; }
    const name = FILES[file] + (8 - row);
    const d = cells[name];
    const white = ch === ch.toUpperCase();
    const span = document.createElement("span");
    span.className = "piece";
    span.textContent = GLYPH[ch.toUpperCase()];
    d.classList.add(white ? "wp" : "bp");
    d.appendChild(span);
    file++;
  }
  if (st.uci) for (const t of targets) cells[t].classList.add("hl");

  if (!browsing && S.check) {
    const side = S.side_to_move === "w" ? "K" : "k";
    const placement2 = placement.replace(/[0-8]/g, m => ".".repeat(+m));
    const k = placement2.replace(/\//g, "").indexOf(side);
    if (k >= 0) cells[FILES[k % 8] + (8 - Math.floor(k / 8))].classList.add("check");
  }

  // selection + legal-target markers (live position, human's turn, not over)
  if (!browsing && sel && S.human_turn && S.termination === "PLAYING") {
    cells[sel].classList.add("sel");
    for (const m of S.legal) {
      if (m.slice(0, 2) !== sel) continue;
      const to = m.slice(2, 4);
      const marker = document.createElement("div");
      marker.className = cells[to].querySelector(".piece") ? "ring" : "dot";
      cells[to].appendChild(marker);
    }
  }

  // status, buttons, move list, fen
  const status = document.getElementById("status");
  if (browsing) {
    status.textContent = `viewing ply ${view}/${live()} \u2014 press \u2192 or End to return to live`;
  } else if (S.termination !== "PLAYING") {
    status.textContent = "Game over: " + termText();
  } else {
    const who = controller(S.side_to_move);
    status.textContent = sideName(S.side_to_move) + " to move \u2014 " +
      (who === "human" ? "your turn (click a piece)" : who + " is thinking\u2026");
  }
  document.getElementById("result").textContent = S.termination === "PLAYING" ? "" : termText();

  const moves = document.getElementById("moves");
  moves.innerHTML = "";
  for (let i = 1; i < S.history.length; i++) {
    if (i % 2 === 1) {
      const num = document.createElement("span");
      num.className = "num"; num.textContent = ((i + 1) / 2) + ".";
      moves.appendChild(num);
    }
    const li = document.createElement("li");
    li.textContent = S.history[i].san || S.history[i].uci;
    if (i === view) li.classList.add("cur");
    li.onclick = () => { view = i; render(); };
    moves.appendChild(li);
    if (i % 2 === 1) moves.appendChild(document.createTextNode(" "));
  }

  document.getElementById("fen").textContent = st.fen;
  document.getElementById("bPrev").disabled = view === 0;
  // ">" steps through recorded history, or (at live, watch mode) asks the
  // server for the next machine move.
  document.getElementById("bNext").disabled =
    !(view < live() || (S.termination === "PLAYING" &&
                        controller(S.side_to_move) !== "human"));
  document.getElementById("bFirst").disabled = view === 0;
  document.getElementById("bLast").disabled = !browsing;
  document.getElementById("bUndo").disabled = !S.can_undo || browsing;
  document.getElementById("bPlay").disabled = !(controller(S.side_to_move) !== "human" && S.termination === "PLAYING");
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? undefined : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const ct = r.headers.get("Content-Type") || "";
  if (!ct.includes("application/json")) return null;  // not one of our endpoints
  const j = await r.json();
  if (!r.ok) { document.getElementById("err").textContent = j.error || r.status; return null; }
  document.getElementById("err").textContent = "";
  return j;
}

async function refresh() { S = await api("/state"); if (S) { view = live(); render(); } }

function onCell(name) {
  if (!S || view < live() || S.termination !== "PLAYING" || !S.human_turn) return;
  if (sel === null) {
    const side = S.side_to_move === "w" ? "w" : "b";
    // own piece with at least one legal move from here?
    if (S.legal.some(m => m.slice(0, 2) === name) && ownPieceAt(name)) sel = name;
  } else if (name === sel) {
    sel = null;
  } else {
    const matches = S.legal.filter(m => m.slice(0, 2) === sel && m.slice(2, 4) === name);
    if (matches.length === 0) { if (ownPieceAt(name)) sel = name; else sel = null; }
    else if (matches.length === 1 && matches[0].length === 4) doMove(matches[0]);
    else if (matches.some(m => m.length === 4)) doMove(matches.find(m => m.length === 4));
    else choosePromotion(matches);   // promotion: 4 variants of the same move
  }
  render();
}

function ownPieceAt(name) {
  // FEN placement flattened to 64 chars (index 0 = a8 … 63 = h1).
  const flat = S.history[live()].fen.split(" ")[0]
    .replace(/[0-8]/g, m => ".".repeat(+m)).replace(/\//g, "");
  const idx = (8 - +name[1]) * 8 + FILES.indexOf(name[0]);
  const ch = flat[idx];
  if (ch === ".") return false;
  return (ch === ch.toUpperCase()) === (S.side_to_move === "w");
}

function choosePromotion(matches) {
  const p = document.getElementById("promo");
  p.style.display = "block";
  p.querySelectorAll("button").forEach(b => b.onclick = () => {
    p.style.display = "none";
    doMove(matches[0].slice(0, 4) + b.dataset.p);
  });
}

async function doMove(uci) {
  sel = null;
  const j = await api("/move", { uci });
  if (j) { S = j; view = live(); render(); }
}

async function step() {
  // NB: /step is a POST endpoint — always pass a (possibly empty) body,
  // or fetch defaults to GET and the server 404s.
  const j = await api("/step", {});
  if (j) {
    const wasBrowsing = view < S.history.length - 1;
    S = j;
    if (!wasBrowsing) view = S.history.length - 1;  // follow live unless browsing
    render();
  }
}

function setPlay(on) {
  const b = document.getElementById("bPlay");
  clearInterval(playTimer); playTimer = null;
  if (on) {
    playTimer = setInterval(async () => {
      await step();
      if (S.termination !== "PLAYING") setPlay(false);
    }, 800);
    b.textContent = "\u23F8";
  } else b.textContent = "\u25B6";
}

document.getElementById("bFirst").onclick = () => { view = 0; render(); };
document.getElementById("bPrev").onclick = () => { if (view > 0) { view--; render(); } };
document.getElementById("bNext").onclick = () => {
  if (view < live()) { view++; render(); }                       // browse history
  else if (S.termination === "PLAYING" &&
           controller(S.side_to_move) !== "human") step();      // watch: next machine move
};
document.getElementById("bLast").onclick = () => { view = live(); render(); };
document.getElementById("bPlay").onclick = () => setPlay(!playTimer);
document.getElementById("bUndo").onclick = async () => {
  const j = await api("/undo", {});
  if (j) { S = j; view = live(); render(); }
};
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") document.getElementById("bPrev").click();
  else if (e.key === "ArrowRight") document.getElementById("bNext").click();
  else if (e.key === "Home") document.getElementById("bFirst").click();
  else if (e.key === "End") document.getElementById("bLast").click();
  else if (e.key === " " && !document.getElementById("bPlay").disabled) { e.preventDefault(); document.getElementById("bPlay").click(); }
});

// setup panel ("value"/"policy" = the supervised side-track nets, need
// VALUE_CKPT; "net" = the PUCT engine, needs --{white,black}-net-ckpt at
// server start)
const OPTIONS = ["human", "greedy", "random", "engine", "value", "policy",
                 "net"];
for (const id of ["selW", "selB"]) {
  const s = document.getElementById(id);
  for (const o of OPTIONS) { const opt = document.createElement("option"); opt.value = o; opt.textContent = o; s.appendChild(opt); }
}
document.getElementById("selW").value = "human";
document.getElementById("selB").value = "greedy";
document.getElementById("bNew").onclick = async () => {
  const j = await api("/reset", { white: document.getElementById("selW").value,
                                  black: document.getElementById("selB").value });
  if (j) { S = j; view = live(); render(); }
};

refresh();
</script>
</body>
</html>
